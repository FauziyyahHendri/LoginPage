<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MooRasa - Profil Pengguna</title>
  <link rel="stylesheet" href="../../bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../motivation%20page/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="mobile-container profile-app">
    <header class="profile-header">
      <a class="profile-brand" href="../../motivation%20page/html/dashboard.html">
        <img src="../../design-assets/logo_besar.png" alt="">
        <span>MooRasa</span>
      </a>
      <h1>Profil Pengguna</h1>
      <a class="menu-button" href="menu-profile.html" aria-label="Buka menu profil">
        <img src="../../design-assets/menu-bar 1.png" alt="">
      </a>
    </header>

    <section class="profile-detail">
      <a class="profile-back" href="../../motivation%20page/html/dashboard.html" aria-label="Kembali">
        <img src="../../design-assets/arrow.png" alt="">
      </a>
      <div class="profile-photo detail-photo">
        <img src="../../design-assets/profil.jpg" alt="Foto profil">
      </div>
      <h2 id="display-name">Pengguna MooRasa</h2>
      <p id="display-email">-</p>
      <div class="profile-info">
        <div><span>Nama Pengguna</span><strong id="info-name">-</strong></div>
        <div><span>Email</span><strong id="info-email">-</strong></div>
        <div><span>No. Hp</span><strong id="info-phone">-</strong></div>
        <div><span>Tanggal Lahir</span><strong id="info-birthdate">-</strong></div>
        <div><span>Jenis Kelamin</span><strong id="info-gender">-</strong></div>
        <div><span>Bio</span><strong id="info-bio">-</strong></div>

      </div>
      <a class="profile-edit" href="lengkapi-profile.html">Edit Profil</a>
    </section>
  </main>
  <script src="../script.js"></script>
</body>
</html>
