<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moorasa - Beranda</title>
  <!--link css-->
  <link rel="stylesheet" href="../css/style.css">
  <!--link bootsrap-->
  <!--link font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--Title font-->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <!--link font body-->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">


</head>
<body>

  <!-- App Wrapper Mobile -->
  <div class="mobile-container">

    <!--splash screen-->
    <div id="splash-screen">
      <img src="../img/logo.png" class="illustration" alt="logo">
      <h2 class="logo-text-splash">MooRasa</h2>
    </div>
    
    <!-- Dashboard Utama -->
    <div id="dashboard" class="dashboard blured">
      <!-- Navbar / Topbar -->
      <div class="topbar">
        <div class="brand">
          <a href="#"></a>
          <img src="../img/logo.jpeg" class="logo" alt="logo">
          <h6 class="logo-text">MooRasa</h6>
        </div>

        <!--beranda-->
        <h2 class="page-title">Beranda</h2>

        <div class="topbar-right">
          <img src="../img/crown.png" alt="Premium" class="crown-icon">
          <img src="../img/profil.jpg" alt="Profile" class="profile-avatar">
        </div>
      </div>

      <!-- Header Sapaan -->
      <div class="greeting">
        <h2>Halo, Teman MooRasa</h2>
        <p>Bagaimana Perasaan Anda Hari Ini?</p>
      </div>

      <!-- Fitur Grid -->
      <div class="features-section">
        <h3>Fitur-Fitur</h3>

        <!-- Banner Besar -->
        <div class="card card-large">
          <a href="#"></a>
          <img src="../img/catatan-harian.png" alt="Catatan Harian">
        </div>

        <!-- Grid 2 Kolom -->
        <div class="grid-2">
          <div class="card">
            <a href="#"></a>
            <img src="../img/penenang.png" alt="Fitur Penenang">
          </div>
          <div class="card">
            <a href="#"></a>
            <img src="../img/hadiah.png" alt="Pengambilan Hadiah">
          </div>
          <div class="card">
            <a href="#"></a>
            <img src="../img/riwayat-mood.png" alt="Riwayat Mood">
          </div>
          <div class="card">
            <a href="#"></a>
            <img src="../img/konsultasi.png" alt="Konsultasi">
          </div>
          <div class="card">
            <a href="#"></a>
            <img src="../img/wadah-emoji.png" alt="Wadah Emosi">
          </div>
        </div>

      </div>
    </div>

    <!-- Transparent Touch Overlay (Menangkap sentuhan pertama) -->
    <div id="touch-overlay" class="touch-overlay hidden"></div>

    <!-- Modal Pop-up Motivasi -->
    <div id="motivation-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-btn" class="close-btn">&times;</button>
        <p class="quote">
          "Kamu tidak harus hebat setiap hari, cukup berusaha untuk menjadi lebih baik dari kemarin"
        </p>
        <p class="sub-quote">
          -Aku berharga, aku cukup, dan aku layak bahagia-
        </p>
      </div>
    </div>  

  </div>

  <script src="../script.js"></script> <!--ini js untuk efek blur-->

  <!--ini js untuk transisi splash screen-->
  <script>
    // Logika Transisi Sederhana 
    window.onload = () => {
        const splash = document.getElementById('splash-screen');
        const welcome = document.getElementById('welcome-screen');

        // Tampilkan Splash selama 2 detik, lalu pindah ke Welcome Screen
        setTimeout(() => {
            splash.classList.add('hidden');
            welcome.classList.add('visible');
        }, 2000);
    };
</script>
</body>
</html>
